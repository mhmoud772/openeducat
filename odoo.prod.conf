[options]
; =========================================================
; إعدادات الإنتاج الرسمية - سمارت إديو (SmartEdu) Odoo 19
; =========================================================

; كلمة مرور مدير قواعد البيانات (يجب تغييرها بكلمة سر قوية عند النشر)
admin_passwd = SmartEduAdminProd2026!Secure

; مسارات الموديلات
addons_path = /mnt/extra-addons/openeducat,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; الاتصال بقاعدة البيانات
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo123
dbfilter = ^openeducat$

; إعدادات الأمان وقفل مدراء القواعد عن الجمهور
list_db = False

; تفعيل نمط البروكسي (ضروري جداً للعمل خلف Nginx و SSL)
proxy_mode = True

; منافذ الاتصال
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072

; إعدادات المعالجة متعددة الأنوية (Multiprocessing)
workers = 4
max_cron_threads = 2

; حدود الذاكرة والموارد (Memory & Time Limits)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192

; السجلات
logfile = /var/lib/odoo/odoo.log
log_level = info
