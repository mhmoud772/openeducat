<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Emblem / Icon -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Diamond -->
    <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Academic Cap / Graduation Cap in Gold -->
    <path d="M 50 25 L 80 40 L 50 55 L 20 40 Z" fill="url(#goldGrad)"/>
    <path d="M 32 46 L 32 62 Q 50 72 68 62 L 68 46 Q 50 56 32 46 Z" fill="url(#goldGrad)"/>
    <!-- Tassel -->
    <path d="M 75 42 L 77 60" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="77" cy="62" r="2.5" fill="#d97706"/>
    
    <!-- Smart Star / Spark -->
    <polygon points="50,66 52,71 57,71 53,74 54,79 50,76 46,79 47,74 43,71 48,71" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <text x="125" y="60" font-family="'Segoe UI', 'Tajawal', 'Cairo', Arial, sans-serif" font-size="42" font-weight="800" fill="#0a192f" letter-spacing="0.5">Smart<tspan fill="#d97706">Edu</tspan></text>
  <text x="128" y="88" font-family="'Segoe UI', 'Tajawal', 'Cairo', Arial, sans-serif" font-size="16" font-weight="600" fill="#475569" letter-spacing="1">نظام الإدارة التعليمية الذكي</text>
</svg>